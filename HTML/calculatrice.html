<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Calculatrice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding-top: 50px;
      background-color: #f0f0f0;
    }
    .calculatrice {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    .resultat {
      width: 100%;
      font-size: 24px;
      padding: 10px;
      text-align: right;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    .touches {
      display: grid;
      grid-template-columns: repeat(4, 60px);
      grid-gap: 10px;
    }
    button {
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background-color: #e0e0e0;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #d0d0d0;
    }
    .egal {
      background-color: #4CAF50;
      color: white;
    }
    .egal:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

<div class="calculatrice">
  <input type="text" id="ecran" class="resultat" disabled>
  <div class="touches">
    <button onclick="ajouter('7')">7</button>
    <button onclick="ajouter('8')">8</button>
    <button onclick="ajouter('9')">9</button>
    <button onclick="ajouter('/')">/</button>

    <button onclick="ajouter('4')">4</button>
    <button onclick="ajouter('5')">5</button>
    <button onclick="ajouter('6')">6</button>
    <button onclick="ajouter('*')">*</button>

    <button onclick="ajouter('1')">1</button>
    <button onclick="ajouter('2')">2</button>
    <button onclick="ajouter('3')">3</button>
    <button onclick="ajouter('-')">-</button>

    <button onclick="ajouter('0')">0</button>
    <button onclick="ajouter('.')">.</button>
    <button onclick="calculer()" class="egal">=</button>
    <button onclick="ajouter('+')">+</button>

    <button onclick="effacer()" style="grid-column: span 4; background-color: #ff6666; color: white;">C</button>
  </div>
</div>

<script>
  const ecran = document.getElementById('ecran');

  function ajouter(valeur) {
    ecran.value += valeur;
  }

  function effacer() {
    ecran.value = '';
  }

  function calculer() {
    try {
      ecran.value = eval(ecran.value);
    } catch (e) {
      ecran.value = 'Erreur';
    }
  }
</script>

</body>
</html>
